name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Phone-friendly setup: if the project was uploaded as a zip, unpack it and commit the files
      - name: Unpack uploaded project zip (first run only)
        run: |
          if [ -f mochi-planner-upload.zip ]; then
            unzip -o mochi-planner-upload.zip -x '.github/*'
            git rm -q --cached mochi-planner-upload.zip
            rm mochi-planner-upload.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898728+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Unpack Mochi Planner source from uploaded zip"
            git push
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ubuntu-latest already ships the Android SDK; just make sure licenses are accepted
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Check translations (zh / en)
        run: node scripts/check-i18n.mjs

      - name: Prepare web assets
        run: |
          test -f node_modules/@capacitor/core/dist/capacitor.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/js/config.js

      - name: Create Android project
        run: |
          npx cap add android
          node scripts/patch-android.js ${{ github.run_number }}
          npx cap sync android

      - name: Use the repository signing key (so new versions install over old ones)
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "MochiPlanner-v0.2.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: MochiPlanner-apk
          path: MochiPlanner-*.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.${{ github.run_number }}
          name: 糯糯学伴 Mochi Planner v0.2.${{ github.run_number }}
          make_latest: true
          files: MochiPlanner-*.apk
          body: |
            📱 **下载安装 / Install**
            1. 在安卓手机或平板上下载下面的 `MochiPlanner-v0.2.${{ github.run_number }}.apk`
            2. 打开文件，允许「安装未知来源应用」，点击安装
            3. 更新时直接安装新版本即可，资料会保留

            Download the APK below on your Android phone/tablet, allow "install unknown apps", and install. Updates install over the previous version and keep your data.

            Commit: ${{ github.sha }}
