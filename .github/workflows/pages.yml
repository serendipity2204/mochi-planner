name: Deploy web app (iPhone / browser)

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check translations (zh / en)
        run: node scripts/check-i18n.mjs

      - name: Stamp build number
        run: |
          sed -i "s/__BUILD__/${{ github.run_number }}/" www/js/config.js www/sw.js
          touch www/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: www

      - name: Wait for the artifact to be available
        run: sleep 30

      - id: deployment
        uses: actions/deploy-pages@v4
